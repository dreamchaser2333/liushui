<!DOCTYPE html>
<html lang="zh-Hant" data-skin="sakura">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffd3df">
<title>小金庫</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* 版面構想：上方一幅日系小畫（櫻花、紫陽花、夏祭、紅葉、雪見），下方是圓角白卡片；記帳用底部彈出的面板與自帶數字鍵。各外觀共用同一結構，只換顏色與畫。 */
:root{
  --bg:#fff4f6; --card:#ffffff; --ink:#5b4452; --ink2:#ad909d; --line:#fbe0e7;
  --acc:#ee6c92; --inc:#45ad9c; --soft:#ffe9ee; --r:22px;
  --shadow:0 8px 22px rgba(238,108,146,.15);
  --petal:#f9a8c0; --petal-r:80% 0 80% 0; --pw:11px; --ph:8px;
  --f-d:"LXGW WenKai TC","Zen Maru Gothic",sans-serif;
  --f-b:"Zen Maru Gothic","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
:root[data-skin="ajisai"]{--bg:#f3f4fc;--ink:#474a6b;--ink2:#9799b8;--line:#e3e5f6;--acc:#7a7fd6;--inc:#3fae9b;--soft:#e9ebfa;
  --shadow:0 8px 22px rgba(122,127,214,.16);--petal:#c4b6f0;--petal-r:50% 50% 50% 0;--pw:8px;--ph:8px}
:root[data-skin="natsu"]{--bg:#eef9fc;--ink:#2f5564;--ink2:#86a9b5;--line:#d6eef4;--acc:#f0704f;--inc:#2a9fb8;--soft:#dff3f8;
  --shadow:0 8px 22px rgba(42,159,184,.15);--petal:transparent}
:root[data-skin="momiji"]{--bg:#fdf5ea;--ink:#5c4032;--ink2:#b0927f;--line:#f5e3cd;--acc:#d9582b;--inc:#6f9a4a;--soft:#fbe9d2;
  --shadow:0 8px 22px rgba(217,88,43,.14);--petal:#e8853a;--petal-r:60% 0 60% 0;--pw:12px;--ph:10px}
:root[data-skin="yuki"]{--bg:#f2f6fa;--ink:#3d4a5c;--ink2:#93a1b3;--line:#dfe7f0;--acc:#5b83c4;--inc:#4aa89a;--soft:#e4ecf5;
  --shadow:0 8px 22px rgba(91,131,196,.15);--petal:#ffffff;--petal-r:50%;--pw:7px;--ph:7px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.55;
  font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
#app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:104px;position:relative}

/* 畫 */
.hero{position:relative;height:176px;overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero-in{position:relative;padding:22px 22px 0;display:flex;flex-direction:column;gap:2px}
.hero .date{font-size:13px;color:var(--ink2)}
.hero h1{font-family:var(--f-d);font-weight:700;font-size:34px;letter-spacing:.14em;margin:2px 0 0;line-height:1.15}
.hero .verse{font-family:var(--f-d);font-size:15px;color:var(--ink2);letter-spacing:.12em}
.petal{position:absolute;top:-16px;width:var(--pw);height:var(--ph);background:var(--petal);border-radius:var(--petal-r);opacity:.85;animation:fall linear infinite}
@keyframes fall{to{transform:translate(-70px,210px) rotate(320deg)}}
@media (prefers-reduced-motion:reduce){.petal{display:none}.veil,.sheet{transition:none!important}}

main{padding:0 16px;display:flex;flex-direction:column;gap:14px;margin-top:-18px;position:relative}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card.flat{padding:4px 16px}
h2{font-family:var(--f-d);font-weight:700;font-size:17px;letter-spacing:.16em;margin:0}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
.head .sub{font-size:13px;color:var(--ink2)}
.muted{color:var(--ink2);font-size:14px;margin:0}
.hint{display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:14px;background:var(--soft);box-shadow:none}
.hint button{flex:none}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;text-align:center}
.stats div{display:flex;flex-direction:column;gap:2px;min-width:0}
.stats .k{font-size:12px;color:var(--ink2);letter-spacing:.1em}
.stats .v{font-size:18px;overflow-wrap:anywhere}
.exp{color:var(--acc)} .inc{color:var(--inc)}

.day{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);padding:12px 2px 2px}
.rows{list-style:none;margin:0;padding:0}
.rows li+li{border-top:1px solid var(--line)}
.rowb{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;padding:11px 0;text-align:left}
.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-d);font-size:15px;background:var(--soft);color:var(--ink2)}
.dot.exp{color:var(--acc)} .dot.inc{color:var(--inc)}
.what{min-width:0}
.what b{font-weight:600;display:block;overflow-wrap:anywhere}
.what span{font-size:12.5px;color:var(--ink2);display:block;overflow-wrap:anywhere}
.num{text-align:right;white-space:nowrap}

.worth{display:flex;flex-direction:column;gap:0;text-align:center;padding:20px 16px}
.worth .k{font-size:13px;color:var(--ink2);letter-spacing:.3em}
.worth .v{font-size:36px;line-height:1.25;font-family:var(--f-d)}
.worth .o{font-size:13px;color:var(--ink2)}
.acc{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;width:100%;padding:13px 0;text-align:left}
.acc .nm{font-weight:600;overflow-wrap:anywhere}
.acc small{font-weight:400;font-size:12px;color:var(--ink2);margin-left:6px}
.acc .go{color:var(--ink2);font-size:13px}
.tag{font-size:12px;margin-right:6px;opacity:.8}
.inv{font-size:12.5px;color:var(--ink2);padding:0 0 12px;display:flex;gap:14px;flex-wrap:wrap}

.monnav{display:flex;align-items:center;justify-content:space-between}
.monnav b{font-family:var(--f-d);font-size:21px;letter-spacing:.1em}
.monnav button{width:40px;height:40px;border-radius:50%;background:var(--soft);font-size:20px}
.bars{display:flex;flex-direction:column;gap:11px}
.bar{display:grid;grid-template-columns:4.6em 1fr auto;gap:10px;align-items:center;font-size:15px}
.bar i{display:block;height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i u{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar.inc i u{background:var(--inc)}
.pct{font-size:12px;color:var(--ink2);margin-left:6px}

.btn{border-radius:99px;padding:9px 18px;background:var(--soft);font-size:15px}
.btn.solid{background:var(--acc);color:#fff}
.btn.warn{color:var(--acc)}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btns.sp{justify-content:space-between}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.skin{border-radius:16px;padding:12px;text-align:left;border:2px solid var(--line);display:flex;flex-direction:column;gap:6px}
.skin[aria-pressed="true"]{border-color:var(--acc)}
.skin b{font-family:var(--f-d);font-size:17px}
.skin span{display:flex;gap:6px}
.skin span i{width:18px;height:18px;border-radius:50%}
.catrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:4px 0}
.in{border:0;border-bottom:1px solid var(--line);background:none;padding:8px 0;width:100%;min-width:0;border-radius:0}
.in:focus{border-bottom-color:var(--acc);outline:none}
.mini{width:36px;height:36px;border-radius:50%;background:var(--soft);font-size:15px;color:var(--ink2)}
.fl{display:flex;flex-direction:column;gap:0;font-size:12.5px;color:var(--ink2)}
.fl .in{font-size:16px;color:var(--ink)}
.err{color:var(--acc);font-size:14px;min-height:1.4em;margin:0}

/* 底部列 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:3;pointer-events:none}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:end;
  background:var(--card);box-shadow:0 -4px 20px rgba(0,0,0,.06);border-radius:var(--r) var(--r) 0 0;pointer-events:auto;padding-bottom:env(safe-area-inset-bottom,0)}
.tabs button.t{padding:13px 0 14px;font-family:var(--f-d);font-size:16px;letter-spacing:.12em;color:var(--ink2)}
.tabs button.t[aria-current="page"]{color:var(--acc)}
.fab{width:62px;height:62px;border-radius:50%;background:var(--acc);color:#fff;font-size:34px;line-height:1;margin:-22px auto 10px;
  box-shadow:0 8px 18px rgba(0,0,0,.18);display:grid;place-items:center}
.fab:active{transform:scale(.95)}

/* 面板 */
.veil{position:fixed;inset:0;background:rgba(30,25,25,.38);z-index:5;display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .18s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:94%;overflow:auto;border-radius:calc(var(--r) + 4px) calc(var(--r) + 4px) 0 0;
  padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.veil.on .sheet{transform:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:99px;padding:3px;flex:1}
.seg button{padding:7px 0;border-radius:99px;font-family:var(--f-d);font-size:16px;letter-spacing:.18em}
.seg button[aria-checked="true"]{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.08);color:var(--acc)}
.e-top{display:flex;gap:10px;align-items:center}
.e-amt{display:flex;align-items:baseline;justify-content:flex-end;gap:8px;padding:2px 4px;border-radius:12px;width:100%}
.e-amt .c{font-size:15px;color:var(--ink2)}
.e-amt .n{font-size:36px;line-height:1.15;font-family:var(--f-d)}
.e-amt.sub .n{font-size:24px}
.e-amt.on{box-shadow:inset 0 0 0 2px var(--acc)}
.e-sec{display:flex;gap:10px;align-items:flex-start}
.e-sec .lab{flex:none;width:3.3em;white-space:nowrap;font-size:12.5px;color:var(--ink2);padding-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border-radius:99px;padding:6px 13px;font-size:15px;background:var(--soft)}
.chip[aria-pressed="true"]{background:var(--acc);color:#fff}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink2)}
.e-row{display:grid;grid-template-columns:1fr auto;gap:12px}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.pad button{height:46px;border-radius:14px;background:var(--soft);font-size:22px;font-family:var(--f-d)}
.pad button:active{filter:brightness(.94)}
.pad .ok{grid-row:span 2;height:auto;background:var(--acc);color:#fff;font-size:20px;letter-spacing:.2em}
.hscroll{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin-top:-4px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{flex:none;font-size:14px;padding:5px 12px}
.chip.dash{background:none;box-shadow:inset 0 0 0 1px var(--ink2);color:var(--ink2)}
.e-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.e-lend{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
#e-accts,#e-lends,#e-tos{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;min-width:0}
#e-accts::-webkit-scrollbar,#e-lends::-webkit-scrollbar,#e-tos::-webkit-scrollbar{display:none}
#e-accts .chip,#e-lends .chip,#e-tos .chip{flex:none}
.e-sec .chips{min-width:0}
.amtbox{border-radius:12px;padding:6px 12px;background:var(--soft);font-size:14px;color:var(--ink2)}
.amtbox b{font-family:var(--f-d);font-size:19px;color:var(--ink);margin-left:2px}
.amtbox.on{box-shadow:inset 0 0 0 2px var(--acc)}
.bar.shop{grid-template-columns:minmax(4.6em,34%) 1fr auto}
.bar.shop>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.head .btn{padding:5px 13px;font-size:14px}
.toast{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:8px 18px;border-radius:99px;
  font-size:14px;z-index:6;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}
textarea{font:12px/1.5 ui-monospace,Menlo,monospace;width:100%;height:170px;background:var(--soft);border:0;border-radius:12px;padding:10px}
@media (min-width:600px){.veil{align-items:center}.sheet{border-radius:calc(var(--r) + 4px)}}
</style>
</head>
<body>
<div id="app">
  <header class="hero">
    <canvas id="art" aria-hidden="true"></canvas>
    <i class="petal" style="left:38%;animation-duration:9s"></i><i class="petal" style="left:62%;animation-duration:12s;animation-delay:-4s"></i>
    <i class="petal" style="left:84%;animation-duration:10s;animation-delay:-7s"></i><i class="petal" style="left:97%;animation-duration:14s;animation-delay:-2s"></i>
    <div class="hero-in">
      <span class="date" id="d-line"></span>
      <h1>小金庫</h1>
      <span class="verse" id="verse"></span>
    </div>
  </header>
  <main id="view"><p class="muted">讀取中…</p></main>
</div>
<nav class="tabs" aria-label="分頁"><div>
  <button class="t" data-act="tab" data-v="home">流水</button>
  <button class="t" data-act="tab" data-v="accounts">帳戶</button>
  <button class="fab" data-act="add" aria-label="記一筆">＋</button>
  <button class="t" data-act="tab" data-v="month">月結</button>
  <button class="t" data-act="tab" data-v="settings">設定</button>
</div></nav>
<div class="veil" id="veil"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="imp" accept=".json,application/json" hidden>

<script>
/*LOGIC*/
const BASE='TWD';
const KINDS={asset:'存款與現金',person:'往來對象',invest:'證券'};
const r2=n=>Math.round(n*100)/100;
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hm(d){return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function monthEnd(m){const [y,mo]=m.split('-').map(Number);return m+'-'+String(new Date(y,mo,0).getDate()).padStart(2,'0')}
function shiftMonth(m,k){const [y,mo]=m.split('-').map(Number);return ymd(new Date(y,mo-1+k,1)).slice(0,7)}
function defaults(){
  const a=(name,kind,order)=>({name,kind,cur:BASE,opening:0,order});
  return {v:2,rev:0,skin:'sakura',lastBackup:0,tx:{},
    cats:{exp:['餐飲','交通','住宿','學業','日用','通訊','娛樂','醫療','其他'],inc:['家裡匯款','稿費','獎助學金','打工','其他']},
    accounts:{post:a('郵局','asset',1),cash:a('現金','asset',2),easycard:a('悠遊卡','asset',3)}};
}
/* 舊版資料相容：欠款兩類併為「往來對象」，補上時間，移除沒用過的預設往來項目。 */
function migrate(S){
  for(const id in S.accounts){const a=S.accounts[id];if(a.kind==='payable'||a.kind==='receivable')a.kind='person'}
  for(const id in S.tx){const t=S.tx[id];if(!t.tm)t.tm=t.ts?hm(new Date(t.ts)):'12:00'}
  if((S.v||1)<2){
    const used={};for(const id in S.tx){const t=S.tx[id];used[t.ac]=1;if(t.to)used[t.to]=1;if(t.lend)used[t.lend.to]=1}
    ['owe','dorm','lent'].forEach(id=>{const a=S.accounts[id];if(a&&!used[id]&&!Number(a.opening))delete S.accounts[id]});
  }
  S.v=2;return S;
}
/* 這筆算進「我的支出」的金額：總額扣掉幫別人墊的部分。 */
function spent(t){return t.t==='expense'?r2(t.a-((t.lend&&t.lend.a)||0)):(t.t==='transfer'&&t.x?t.a:0)}
function allTx(tx){
  const out=[];for(const id in tx)out.push(Object.assign({id},tx[id]));
  out.sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:(a.tm||'')<(b.tm||'')?1:(a.tm||'')>(b.tm||'')?-1:(b.ts||0)-(a.ts||0));return out;
}
/* 各帳戶在 upto（含）當日的金額。往來對象：正數＝對方欠我，負數＝我欠對方。 */
function balances(accounts,txs,upto){
  const b={};for(const id in accounts)b[id]=Number(accounts[id].opening)||0;
  const add=(k,v)=>{if(k!=null)b[k]=r2((b[k]||0)+v)};
  for(const t of txs){
    if(upto&&t.d>upto)continue;
    if(t.t==='expense'){add(t.ac,-t.a);if(t.lend)add(t.lend.to,t.lend.a)}
    else if(t.t==='income')add(t.ac,t.a);
    else if(t.t==='transfer'){add(t.ac,-t.a);add(t.to,t.ta!=null?t.ta:t.a)}
    else if(t.t==='adjust')add(t.ac,t.a);
  }
  return b;
}
function monthSummary(accounts,txs,m){
  const inc={},exp={},incCat={},expCat={},shops={};
  const cur=id=>(accounts[id]&&accounts[id].cur)||BASE;
  const put=(o,k,v)=>{o[k]=r2((o[k]||0)+v)};
  for(const t of txs){
    if(t.d.slice(0,7)!==m)continue;const c=cur(t.ac);
    if(t.t==='income'){put(inc,c,t.a);if(c===BASE)put(incCat,t.c||'其他',t.a)}
    else{const v=spent(t);if(!v)continue;put(exp,c,v);
      if(c===BASE){put(expCat,t.t==='expense'?(t.c||'其他'):t.x,v);
        if(t.shop){const s=shops[t.shop]=shops[t.shop]||{sum:0,n:0};s.sum=r2(s.sum+v);s.n++}}}
  }
  return {inc,exp,incCat,expCat,shops};
}
/* 店家建議：這個分類最常去的排前面，其次是整體最常去的。 */
function shopRank(txs,cat){
  const m={};
  for(const t of txs){if(t.t!=='expense'||!t.shop)continue;const s=m[t.shop]=m[t.shop]||{n:0,c:0};s.n++;if(t.c===cat)s.c++}
  return Object.keys(m).sort((a,b)=>m[b].c-m[a].c||m[b].n-m[a].n||a.localeCompare(b,'zh-Hant'));
}
function worth(accounts,bal,useMarket){
  const w={};
  for(const id in accounts){const a=accounts[id];let v=bal[id]||0;
    if(useMarket&&a.kind==='invest'&&a.market!=null&&a.market!=='')v=Number(a.market);
    const c=a.cur||BASE;w[c]=r2((w[c]||0)+v)}
  return w;
}
function toCsv(accounts,txs){
  const nm=id=>id&&accounts[id]?accounts[id].name:'';
  const T={expense:'支出',income:'收入',transfer:'轉帳',adjust:'校正'};
  const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const rows=[['日期','時間','類型','金額','幣別','付款或帳戶','轉入帳戶','轉入金額','分類','店家','細目','幫誰墊','代墊金額','計入我的支出']];
  for(const t of txs.slice().reverse())rows.push([t.d,t.tm||'',T[t.t]||t.t,t.a,(accounts[t.ac]&&accounts[t.ac].cur)||BASE,nm(t.ac),nm(t.to),t.ta!=null?t.ta:'',t.c||t.x||'',t.shop||'',t.n||'',t.lend?nm(t.lend.to):'',t.lend?t.lend.a:'',t.t==='expense'||t.x?spent(t):'']);
  return '﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n');
}

/* 數字鍵：回傳按鍵後的字串 */
function keyIn(s,k){
  if(k==='back')return s.slice(0,-1);
  if(k==='clear')return '';
  if(k==='.')return s.includes('.')?s:(s||'0')+'.';
  const dot=s.indexOf('.');
  if(dot>=0){return (s+k).slice(0,dot+3)}
  const n=(s==='0'?'':s)+k;
  return n.replace(/^0+(?=\d)/,'').slice(0,9)||'0';
}

function lunar(d){
  try{
    const p=new Intl.DateTimeFormat('zh-TW-u-ca-chinese',{year:'numeric',month:'long',day:'numeric'}).formatToParts(d);
    const g=t=>(p.find(x=>x.type===t)||{}).value||'';

    const dn=day<=10?'初'+D[day-1]:day<20?'十'+D[day-11]:day===20?'二十':day<30?'廿'+D[day-21]:'三十';
    return mo+dn;
  }catch(e){return ''}
}

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  const dpr=Math.min(window.devicePixelRatio||1,2.5);c.width=w*dpr;c.height=h*dpr;
  const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);
  ({sakura:drawSakura,ajisai:drawAjisai,natsu:drawNatsu,momiji:drawMomiji,yuki:drawYuki}[S.skin]||drawSakura)(x,w,h);
  const g=x.createLinearGradient(0,h-46,0,h);const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();

function txRow(t){
  let dot=['',''],cls='',sign='',title,amt=t.a;const subs=[t.tm||''];
  if(t.t==='expense'){
    const v=spent(t);dot=['exp','支'];cls='exp';sign='−';amt=v;title=t.n||t.shop||t.c;
    if(t.n||t.shop)subs.push(t.c);if(t.n&&t.shop)subs.push(t.shop);
    subs.push(isPerson(t.ac)?an(t.ac)+'墊':an(t.ac));
    if(t.lend)subs.push('幫'+an(t.lend.to)+'墊 '+fmt(t.lend.a,accCur(t.ac)));
    if(!v){dot=['','墊'];cls='';sign='';amt=t.a}
  }else if(t.t==='income'){dot=['inc','收'];cls='inc';sign='+';title=t.n||t.c;if(t.n)subs.push(t.c);subs.push(an(t.ac))}
  else if(t.t==='transfer'){
    const pt=isPerson(t.to),pf=isPerson(t.ac),path=an(t.ac)+' → '+an(t.to);
    dot=['',pt||pf?'還':'轉'];title=t.n||(pt?'還款給'+an(t.to):pf?an(t.ac)+'還款':path);
    if(t.n||pt||pf)subs.push(path);if(t.x){subs.push('計入'+t.x);cls='exp';sign='−'}
  }else{dot=['','校'];title=t.n||'對帳校正';subs.push(an(t.ac));sign=t.a<0?'−':'+'}
  return '<li><button class="rowb" data-act="tx" data-v="'+esc(t.id)+'"><span class="dot '+dot[0]+'">'+dot[1]+'</span><span class="what"><b>'+esc(title)+'</b><span>'+esc(subs.filter(Boolean).join('・'))+'</span></span><span class="num '+cls+'">'+sign+fmt(Math.abs(amt),accCur(t.ac))+'</span></button></li>';
}
function dayLabel(d){const x=new Date(d+'T00:00:00'),t=ymd(new Date());return (d===t?'今天　':'')+(x.getMonth()+1)+' 月 '+x.getDate()+' 日　週'+'日一二三四五六'[x.getDay()]}
function dayGroups(txs){
  let html='',cur=null,buf=[];
  const flush=()=>{if(!cur)return;let o=0,i=0;buf.forEach(t=>{if(accCur(t.ac)!==BASE)return;o+=spent(t);if(t.t==='income')i+=t.a});
    html+='<div class="day"><span>'+dayLabel(cur)+'</span><span>'+(i?'入 '+fmt(i)+'　':'')+(o?'出 '+fmt(o):'')+'</span></div><ul class="rows">'+buf.map(txRow).join('')+'</ul>'};
  for(const t of txs){if(t.d!==cur){flush();cur=t.d;buf=[]}buf.push(t)}
  flush();return html;
}

  if(fresh)h+='<div class="card hint"><span>第一步：到「帳戶」填入各帳戶現在的金額。</span><button class="btn" data-act="tab" data-v="accounts">前往</button></div>';
  const days=S.lastBackup?Math.floor((Date.now()-S.lastBackup)/864e5):null;
  if(txs.length>=5&&(days===null||days>=14))h+='<div class="card hint"><span>'+(days===null?'還沒有備份過。':'已經 '+days+' 天沒有備份。')+'資料只存在這支手機裡。</span><button class="btn" data-act="tab" data-v="settings">去備份</button></div>';
  h+='<div class="card stats"><div><span class="k">今日支出</span><span class="v exp">'+fmt(o)+'</span></div><div><span class="k">本月支出</span><span class="v exp">'+fmt(s.exp[BASE]||0)+'</span></div><div><span class="k">本月收入</span><span class="v inc">'+fmt(s.inc[BASE]||0)+'</span></div></div>';

function entryErr(t){const e=$('e-err');e.textContent=t;e.hidden=!t}
function saveEntry(){
  const a=parseAmt(E.amt),now=new Date();
  if(!(a>0))return entryErr('請輸入金額');
  if(!E.acct)return entryErr('請選擇帳戶');
  const old=E.id?S.tx[E.id]:null;
  const t={t:E.type,d:$('e-date').value||ymd(now),tm:$('e-time').value||hm(now),a,ac:E.acct,n:$('e-note').value.trim(),ts:old?old.ts:Date.now()};
  if(E.type==='expense'){
    t.c=E.cat;const shop=$('e-shop').value.trim();if(shop)t.shop=shop;
    if(E.lend&&!isPerson(E.acct)){const la=parseAmt(E.la);
      if(!(la>0))return entryErr('請填幫'+an(E.lend)+'墊了多少，或點「全額」「一半」');
      if(la>a)return entryErr('代墊金額不能超過總額');
      t.lend={to:E.lend,a:la}}
  }else if(E.type==='income')t.c=E.cat;
  else{
    if(!E.to)return entryErr('請選擇轉入的帳戶');
    t.to=E.to;
    if(accCur(E.to)!==accCur(E.acct)){const ta=parseAmt(E.ta);if(!(ta>0))return entryErr('兩邊幣別不同，請點「轉入後」填入金額');t.ta=ta}
    if(old&&old.x)t.x=old.x;
  }
  S.tx[E.id||newId()]=t;save();
  if(!isPerson(E.acct)&&E.type!=='transfer'){try{localStorage.setItem('liushui-acct',E.acct)}catch(e){}}
  const what=t.n||t.shop||(t.t==='transfer'?an(t.ac)+' → '+an(t.to):t.c);
  toast((E.id?'已修改　':'已記下　')+what+'　'+fmt(a,accCur(t.ac)));
  closeSheet();paint();
}

    const rel=txs.filter(t=>t.ac===id||t.to===id||(t.lend&&t.lend.to===id));
    h+='<div class="card hint" style="justify-content:space-between"><span class="num '+st[0]+'" style="font-size:18px;text-align:left">'+st[1]+'</span><button class="btn solid" data-act="settle" data-v="'+esc(id)+'">'+(v>0?'記收款':'記還款')+'</button></div>';
    h+='<div><div class="head" style="margin-bottom:0"><h2>往來紀錄</h2><span class="sub">'+rel.length+' 筆</span></div>'+(rel.length?'<ul class="rows">'+rel.slice(0,30).map(t=>txRow(t).replace('<span class="what"><b>','<span class="what"><b>'+esc(t.d.slice(5).replace('-','/'))+'　')).join('')+'</ul>':'<p class="muted">還沒有紀錄。</p>')+'</div><p class="muted" style="border-top:1px solid var(--line);padding-top:10px">修改資料</p>'}
  h+='<label class="fl">名稱<input class="in" id="a-name" value="'+esc(a.name)+'" placeholder="'+(P?'例如：小明':'例如：郵局')+'" maxlength="20"></label>';
  h+='<label class="fl">種類<select class="in" id="a-kind">'+opt(Object.keys(KINDS),a.kind,k=>KINDS[k])+'</select></label>';
  h+='<label class="fl" id="a-cur-wrap"'+(P?' hidden':'')+'>幣別代碼（TWD、MYR、USD…）<input class="in" id="a-cur" value="'+esc(a.cur||BASE)+'" maxlength="5"></label>';
  h+='<label class="fl" id="a-dir-wrap"'+(P?'':' hidden')+'>開始記帳時的狀態<select class="in" id="a-dir"><option value="1"'+(o>=0?' selected':'')+'>他欠我</option><option value="-1"'+(o<0?' selected':'')+'>我欠他</option></select></label>';
  h+='<label class="fl"><span id="a-open-lab">'+(P?'當時的金額（沒有就留空）':'期初金額（開始記帳那一刻的數字）')+'</span><input class="in" id="a-open" inputmode="decimal" value="'+esc(Math.abs(o)||'')+'" placeholder="0"></label>';
  h+='<label class="fl" id="a-mk-wrap"'+(a.kind==='invest'?'':' hidden')+'>目前市值（選填，用來算損益）<input class="in" id="a-mk" inputmode="decimal" value="'+esc(a.market!=null?a.market:'')+'"></label>';
  h+='<p class="err" id="a-err"></p><div class="btns sp">'+(id?'<button class="btn warn" data-act="acc-del" data-v="'+esc(id)+'">'+(a.closed?'重新啟用':'刪除')+'</button>':'<span></span>')+'<button class="btn solid" data-act="acc-save" data-v="'+esc(id||'')+'">儲存</button></div>';
  if(id&&!P){const v=balances(S.accounts,allTx(S.tx),null)[id]||0;
    h+='<label class="fl" style="border-top:1px solid var(--line);padding-top:12px">對帳：帳面是 '+fmt(v,a.cur)+'。與實際不符時，填入實際數字<input class="in" id="a-real" inputmode="decimal" placeholder="實際金額"></label><div class="btns" style="justify-content:flex-end"><button class="btn" data-act="acc-adj" data-v="'+esc(id)+'">記一筆校正</button></div>'}
  openSheet(h);
}
function accSave(id){
  const name=$('a-name').value.trim();if(!name)return $('a-err').textContent='請填名稱';
  const kind=$('a-kind').value,P=kind==='person',o=Math.abs(parseAmt($('a-open').value)||0);
  const a=id?Object.assign({},acc(id)):{order:Date.now()};
  a.name=name;a.kind=kind;a.cur=P?BASE:($('a-cur').value.trim().toUpperCase()||BASE);
  a.opening=P?o*Number($('a-dir').value):(parseAmt($('a-open').value)||0);
  const mk=parseAmt($('a-mk').value);if(kind==='invest'&&isFinite(mk))a.market=mk;else delete a.market;
  S.accounts[id||newId(P?'p':'a')]=a;save();closeSheet();paint();toast('已儲存　'+name);
}
function accDel(id,btn){
  const a=acc(id);
  if(a.closed){delete a.closed;save();closeSheet();paint();return}
  const used=Object.values(S.tx).some(t=>t.ac===id||t.to===id||(t.lend&&t.lend.to===id));
  if(btn.dataset.sure!=='1'){btn.dataset.sure='1';btn.textContent=used?'已有紀錄，改為停用？':'確定刪除？';return}
  if(used)a.closed=true;else delete S.accounts[id];
  save();closeSheet();paint();
}
function accAdjust(id){
  const real=parseAmt($('a-real').value);if(!isFinite(real))return;
  const v=balances(S.accounts,allTx(S.tx),null)[id]||0,diff=r2(real-v),now=new Date();
  if(diff!==0){S.tx[newId('j')]={t:'adjust',d:ymd(now),tm:hm(now),a:diff,ac:id,n:'對帳校正',ts:Date.now()};save()}
  closeSheet();paint();toast(diff?'已校正':'帳面與實際相符');
}
function settle(id){
  const v=balances(S.accounts,allTx(S.tx),null)[id]||0,mine=ownDefault();
  openEntry(null,v>0?{type:'transfer',acct:id,to:mine,amt:String(v)}:{type:'transfer',acct:mine,to:id,amt:v<0?String(-v):''});
}

/* 匯出入 */
function giveFile(name,text,mime){
  if(framed){openSheet('<div class="e-top"><h2 style="flex:1">'+esc(name)+'</h2><button class="mini" data-act="close" aria-label="關閉">✕</button></div><p class="muted">預覽環境不能直接存檔，請複製內容。安裝成 app 後會直接下載檔案。</p><textarea id="x-out" readonly>'+esc(text.replace(/^﻿/,''))+'</textarea><div class="btns" style="justify-content:flex-end"><button class="btn solid" data-act="copy">複製</button></div>');return true}
  try{const u=URL.createObjectURL(new Blob([text],{type:mime}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true}catch(e){toast('匯出失敗');return false}
}
function doBackup(){if(giveFile('小金庫備份-'+ymd(new Date())+'.json',JSON.stringify(S,null,1),'application/json')){S.lastBackup=Date.now();save();if(!framed){paint();toast('備份檔已匯出')}}}
function doCsv(){giveFile('小金庫-'+ymd(new Date())+'.csv',toCsv(S.accounts,allTx(S.tx)),'text/csv')}
let pending=null;
$('imp').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const o=JSON.parse(await f.text());if(!validBackup(o))throw 0;pending=o;
    openSheet('<h2>匯入備份檔</h2><p class="muted">備份檔內有 '+Object.keys(o.tx).length+' 筆紀錄、'+Object.keys(o.accounts).length+' 個帳戶。匯入後會取代這支手機上目前的 '+Object.keys(S.tx).length+' 筆紀錄，無法復原。</p><div class="btns sp"><button class="btn" data-act="close">取消</button><button class="btn solid" data-act="imp-ok">取代並匯入</button></div>');
  }catch(x){toast('這不是小金庫的備份檔')}
});

/* ---------- 事件 ---------- */
document.addEventListener('click',e=>{
  if(e.target===$('veil'))return closeSheet();
  const b=e.target.closest('[data-act]');if(!b)return;
  const v=b.dataset.v,k=b.dataset.k;
  switch(b.dataset.act){
    case 'tab':tab=v;paint();window.scrollTo(0,0);break;
    case 'add':openEntry(null);break;
    case 'tx':openEntry(v);break;
    case 'tx-del':if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='確定刪除？'}else{delete S.tx[v];save();closeSheet();paint();toast('已刪除')}break;
    case 'e-type':E.type=v;E.newp=null;paintEntry();break;
    case 'e-cat':E.cat=v;paintEntry();break;
    case 'e-acct':E.acct=v;paintEntry();break;
    case 'e-to':E.to=v;paintEntry();break;
    case 'e-lend':E.lend=v||null;E.focus=v?'la':'amt';if(!v)E.la='';paintEntry();break;
    case 'e-la-fill':{const a=parseAmt(E.amt);if(a>0){E.la=String(r2(a*Number(v)));entryErr('')}else entryErr('請先輸入總金額');E.focus='amt';paintEntry()}break;
    case 'e-newp-open':E.newp=v;paintEntry();$('e-newp').focus();break;
    case 'e-newp-add':addPerson();break;
    case 'e-shop':$('e-shop').value=v;paintShops();break;
    case 'e-focus':E.focus=v;paintEntry();break;
    case 'e-key':E[E.focus]=keyIn(E[E.focus],v);entryErr('');paintEntry();break;
    case 'e-save':saveEntry();break;
    case 'acc':accSheet(v);break;
    case 'newacc':accSheet(null,v);break;
    case 'acc-save':accSave(v);break;
    case 'acc-del':accDel(v,b);break;
    case 'acc-adj':accAdjust(v);break;
    case 'settle':settle(v);break;
    case 'mon':month=shiftMonth(month,Number(v));paint();break;
    case 'skin':S.skin=v;save();paintHero();paint();break;
    case 'cat-up':{const l=S.cats[k],i=Number(v);if(i>0){[l[i-1],l[i]]=[l[i],l[i-1]];save();paint()}}break;
    case 'cat-del':if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='刪';b.style.color='var(--acc)'}else{S.cats[k].splice(Number(v),1);save();paint()}break;
    case 'cat-add':{const i=$('newcat-'+k),n=i.value.trim();if(!n)break;if(S.cats[k].includes(n)){toast('已經有這個分類');break}S.cats[k].push(n);save();paint();toast('已加入　'+n)}break;
    case 'backup':doBackup();break;
    case 'csv':doCsv();break;
    case 'import':$('imp').click();break;
    case 'imp-ok':if(pending){S=migrate(Object.assign(defaults(),pending));pending=null;save();closeSheet();paintHero();paint();toast('已匯入')}break;
    case 'wipe':if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='確定清空？再按一次'}else{const sk=S.skin;S=defaults();S.skin=sk;save();paint();window.scrollTo(0,0);toast('已清空，可以重新開始')}break;
    case 'copy':navigator.clipboard.writeText($('x-out').value).then(()=>{b.textContent='已複製'},()=>{$('x-out').select()});break;
    case 'close':closeSheet();break;
  }
});
document.addEventListener('input',e=>{if(e.target.id==='e-shop')paintShops()});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='a-kind'){const k=t.value;$('a-mk-wrap').hidden=k!=='invest';$('a-dir-wrap').hidden=k!=='person';$('a-cur-wrap').hidden=k==='person';
    $('a-open-lab').textContent=k==='person'?'當時的金額（沒有就留空）':'期初金額（開始記帳那一刻的數字）'}
  if(t.dataset.cat){
    const kind=t.dataset.cat,i=Number(t.dataset.i),old=S.cats[kind][i],n=t.value.trim();
    if(!n||n===old){t.value=old;return}
    if(S.cats[kind].includes(n)){t.value=old;toast('已經有這個分類');return}
    S.cats[kind][i]=n;
    const ty=kind==='exp'?'expense':'income';
    for(const id in S.tx){const x=S.tx[id];if(x.t===ty&&x.c===old)x.c=n;if(kind==='exp'&&x.x===old)x.x=n}
    save();toast('已改名為　'+n);
  }
  if(t.dataset.shop!=null&&t.dataset.shop!==''){
    const old=t.dataset.shop,n=t.value.trim();if(!n||n===old){t.value=old;return}
    let merged=false;for(const id in S.tx){const x=S.tx[id];if(x.shop===n)merged=true}
    for(const id in S.tx){const x=S.tx[id];if(x.shop===old)x.shop=n}
    save();paint();toast(merged?'已併入　'+n:'已改名為　'+n);
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='Enter'&&e.target.id==='e-newp'){e.preventDefault();addPerson()}});
window.addEventListener('resize',drawArt);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){paintHero();if(!E&&!$('veil').classList.contains('on'))paint()}});

/* ---------- 啟動 ---------- */
function showErr(e){const m=(e&&(e.message||e.reason&&e.reason.message))||String(e);const v=$('view');if(v)v.insertAdjacentHTML('afterbegin','<div class="card hint"><span>遇到問題：'+esc(m)+'。請截圖傳給 Claude。</span></div>')}
window.addEventListener('error',showErr);window.addEventListener('unhandledrejection',showErr);
(async()=>{
  try{await load()}catch(e){showErr(e)}
  try{paintHero()}catch(e){showErr(e)}
  try{paint()}catch(e){showErr(e)}
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawArt).catch(()=>{});
  if(!framed&&'serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
